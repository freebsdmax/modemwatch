<%+header%>

<h2 name="content"><%:Log%></h2>

<style>
	.cbi-map > .cbi-section {
		padding: 1rem 1.25rem;
	}
	.mw-log-row {
		display: flex;
		flex-wrap: wrap;
		gap: 0.75em;
		align-items: center;
		margin-bottom: 0.75em;
	}
	.mw-log-output {
		background: rgba(0,0,0,0.06);
		border: 1px solid rgba(128,128,128,0.3);
		border-radius: 4px;
		padding: 0.75em;
		max-height: 70vh;
		overflow: auto;
		white-space: pre-wrap;
		font-family: monospace;
		font-size: 0.9em;
	}
	.mw-log-status {
		font-size: 0.9em;
		opacity: 0.8;
	}
</style>

<div class="cbi-map">
	<div class="cbi-section">
		<div class="mw-log-row">
			<button class="cbi-button cbi-button-action" id="mw-log-refresh"><%:Refresh log%></button>
			<label><input type="checkbox" id="mw-log-auto" /> <%:Auto-refresh%></label>
			<span class="mw-log-status" id="mw-log-status"></span>
		</div>
		<pre class="mw-log-output" id="mw-log">—</pre>
	</div>
</div>

<script type="text/javascript">
(function() {
	var mw = {
		urls: {
			logs: '<%=luci.dispatcher.build_url("admin", "modem", "modemwatch", "logs")%>'
		},
		timer: null
	};

	function setStatus(text) {
		var el = document.getElementById('mw-log-status');
		if (el) el.textContent = text || '';
	}

	function loadLogs() {
		fetch(mw.urls.logs + '?lines=200', { cache: 'no-store', credentials: 'same-origin' })
			.then(function(r) {
				if (!r.ok) throw new Error('HTTP ' + r.status);
				return r.text();
			})
			.then(function(text) {
				var el = document.getElementById('mw-log');
				if (!el) return;
				el.textContent = text || '<%:(empty)%>';
				el.scrollTop = el.scrollHeight;
				setStatus('<%:Updated%>: ' + new Date().toLocaleTimeString());
			})
			.catch(function(e) {
				setStatus('<%:Failed to read log%>: ' + e.message);
			});
	}

	function setAuto(on) {
		if (mw.timer) {
			clearInterval(mw.timer);
			mw.timer = null;
		}
		if (on) mw.timer = setInterval(loadLogs, 5000);
	}

	var btnRefresh = document.getElementById('mw-log-refresh');
	if (btnRefresh) btnRefresh.onclick = loadLogs;

	var chkAuto = document.getElementById('mw-log-auto');
	if (chkAuto) chkAuto.onchange = function() { setAuto(chkAuto.checked); };

	loadLogs();
})();
</script>

<%+footer%>
